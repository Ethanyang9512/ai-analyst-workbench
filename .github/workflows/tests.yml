name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib:
    # 只用标准库：仓库自查、钩子和工具、技能检查程序里不需要第三方库的部分、两个示例脚本。
    # 缺可选依赖的组会显示“跳过”，不算失败。考场（exam/harness）要 macOS 的 sandbox-exec 和已登录的 claude，不在 CI 里跑。
    name: stdlib · ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 全部测试（标准库）
        run: bash tools/run_all_tests.sh

  optional-deps:
    # 装上 matplotlib、python-pptx、PyMuPDF、PuLP、OR-Tools 后，把跳过的组也跑一遍。
    name: optional deps · ubuntu-latest · Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 中文字体（出图测试要量文字的实际宽度）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 安装可选依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 全部测试（含可选组）
        env:
          AAW_PY: python
          PULP_PY: python
          PY: python
        run: bash tools/run_all_tests.sh
